[package]
name = "print-server"
version = "0.1.0"
edition = "2024"

[dependencies]
escpos = { version = "0.19.0", default-features = false, features = [
    "std",
    "usb",
] }
eyre = "0.6.12"
minreq = { version = "2", features = ["https"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
